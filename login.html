<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | เที่ยวบ้านเรา</title>
    <!-- นำเข้าฟอนต์ภาษาไทย Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #f4f7f5;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ส่วนแถบเมนูด้านบน (Navbar) */
        header {
            background-color: #2c4c3b;
            color: #ffffff;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        nav a {
            color: #ffffff;
            text-decoration: underline;
            font-size: 16px;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.8;
        }

        /* ตกแต่งปุ่มเมนูหน้าที่กำลังเปิดอยู่ (เข้าสู่ระบบ) ให้ดูเด่นขึ้นเหมือนในรูป */
        nav a.active {
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 4px 12px;
            border-radius: 6px;
        }

        /* ส่วนพื้นที่ตรงกลางสำหรับวางกล่อง Login */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .login-card h2 {
            text-align: center;
            color: #2c4c3b;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #666666;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 15px;
            color: #222222;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 15px;
            color: #333333;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #2c4c3b;
        }

        .form-control::placeholder {
            color: #a0a0a0;
        }

        /* จัดวางช่องรหัสผ่านคู่กับปุ่ม "แสดง" */
        .password-wrapper {
            display: flex;
            gap: 10px;
        }

        .password-wrapper .form-control {
            flex: 1;
        }

        .btn-toggle {
            background-color: #2c4c3b;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 0 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-toggle:hover {
            background-color: #213a2d;
        }

        /* ปุ่มเข้าสู่ระบบหลัก */
        .btn-submit {
            width: 100%;
            background-color: #2c4c3b;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #213a2d;
        }

        /* กล่องข้อความแนะนำบัญชีทดลองด้านล่าง */
        .demo-box {
            margin-top: 24px;
            background-color: #f6f8f7;
            border: 1px solid #e6ece8;
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 14px;
            color: #333333;
            line-height: 1.6;
        }

        .demo-box strong {
            font-weight: 600;
            color: #111111;
        }
    </style>
</head>
<body>

    <!-- ส่วนหัวเว็บและเมนู -->
    <header>
        <h1>เที่ยวบ้านเรา</h1>
        <nav>
            <ul>
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="places.html">ที่เที่ยว</a></li>
                <li><a href="food.html">อาหาร</a></li>
                <li><a href="plan.html">วางแผนเที่ยว</a></li>
                <li><a href="travel.html">ข้อมูลการเดินทาง</a></li>
                <!-- เมนูเข้าสู่ระบบย้ายมาอยู่ต่อท้ายข้อมูลการเดินทางแล้ว -->
                <li><a href="login.html" class="active">เข้าสู่ระบบ</a></li>
            </ul>
        </nav>
    </header>

    <!-- ส่วนฟอร์มเข้าสู่ระบบ -->
    <main>
        <div class="login-card">
            <h2>เข้าสู่ระบบ</h2>
            <p class="subtitle">ยินดีต้อนรับสู่เว็บไซต์เที่ยวบ้านเรา</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้</label>
                    <input type="text" id="username" class="form-control" placeholder="กรอกชื่อผู้ใช้" required>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="กรอกรหัสผ่าน" required>
                        <button type="button" id="togglePassword" class="btn-toggle">แสดง</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="role">ประเภทผู้ใช้งาน</label>
                    <select id="role" class="form-control">
                        <option value="user">สมาชิก (User)</option>
                        <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
            </form>

            <div class="demo-box">
                <strong>บัญชีทดลองสำหรับฝึกปฏิบัติ</strong><br>
                Admin: <strong>admin</strong> / <strong>admin123</strong><br>
                User: <strong>user</strong> / <strong>user123</strong>
            </div>
        </div>
    </main>

    <!-- สคริปต์สำหรับปุ่มแสดง/ซ่อนรหัสผ่าน และจำลองการล็อกอิน -->
    <script>
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePasswordBtn.addEventListener('click', function () {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.textContent = 'ซ่อน';
            } else {
                passwordInput.type = 'password';
                this.textContent = 'แสดง';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            if (role === 'admin' && username === 'admin' && password === 'admin123') {
                alert('เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับผู้ดูแลระบบ (Admin)');
            } else if (role === 'user' && username === 'user' && password === 'user123') {
                alert('เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับสมาชิก (User)');
            } else {
                alert('ชื่อผู้ใช้ รหัสผ่าน หรือประเภทผู้ใช้งานไม่ถูกต้อง');
            }
        });
    </script>

</body>
</html>
